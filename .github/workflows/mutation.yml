name: Mutation testing

# Weekly mutmut run over src/omada_migrator (scripts/mutate.sh --all). It reports the score in
# the job summary; it is not a required check and never blocks a pull request. Run
# `scripts/mutate.sh` locally for the modules a change touches.

on:
  schedule:
    - cron: "53 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --extra dev
      - name: mutmut
        run: bash scripts/mutate.sh --all | tee mutate.log
      - name: Report mutation score
        if: always()
        run: |
          {
            echo "## Mutation testing"
            echo
            grep '^Score:' mutate.log || echo "No score: the run did not finish."
            echo
            echo '```'
            uv run --locked mutmut results 2>/dev/null | grep -v ': not checked$' | head -300 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
