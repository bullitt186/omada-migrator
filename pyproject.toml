[project]
name = "omada-migrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.2",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.24",
    "pydantic>=2.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.5.0",
    "pytest-httpx>=0.30",
    "respx>=0.20",
    # Checks of AGENTS.md "Commands" (exact versions; uv.lock pins the rest)
    "ruff==0.17.4",
    "mypy==2.4.1",
    "mutmut==3.8.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Lint and format (repo-kit CI standard, category 2): `ruff check . && ruff format --check .`
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "I"]

[tool.mypy]
# Type check (repo-kit CI standard, category 3): `mypy`. Strict options that the code meets are
# on; the ones it does not meet yet are off (most functions take and return untyped JSON dicts).
files = ["src/omada_migrator"]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Findings in the code when the type check was introduced (#4): Optional values used without a
# None check, a list and a dict whose declared item type is narrower than what is stored, and a
# variable reused for a WriteOp. Each is a possible bug and is tracked in a follow-up issue;
# remove a code here when its findings are fixed, never add one.
[[tool.mypy.overrides]]
module = "omada_migrator.app"
disable_error_code = ["assignment", "index", "misc", "attr-defined"]

[[tool.mypy.overrides]]
module = "omada_migrator.auth"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "omada_migrator.registry"
disable_error_code = ["arg-type", "misc"]

[[tool.mypy.overrides]]
module = "omada_migrator.spec_store"
disable_error_code = ["return-value", "dict-item"]

[tool.mutmut]
# Mutation testing (scripts/mutate.sh, weekly workflow): the package against tests/.
source_paths = ["src/omada_migrator"]
pytest_add_cli_args_test_selection = ["tests/"]
